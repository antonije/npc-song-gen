[project]
name = "npc-song-gen"
version = "0.1.0"
description = "NPC song generator for game mods via local ACE-Step 1.5 + optional Demucs purification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
purify = [
    "demucs>=4.0.0",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false
